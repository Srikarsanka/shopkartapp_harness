service:
  name: ${name}
  identifier: ${identifier}
  orgIdentifier: ${org_id}
  projectIdentifier: ${project_id}
  tags:
    environment: ${environment}
    tier: backend
    framework: express
    managed_by: terraform
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: ${identifier}_manifest
            type: K8sManifest
            spec:
              store:
                type: Git
                spec:
                  connectorRef: ${connector_ref}
                  gitFetchType: Branch
                  paths:
                    - k8s/backend-deployment.yaml
                    - k8s/backend-service.yaml
                    - k8s/configmap.yaml
                  repoName: ${repo_name}
                  branch: ${branch}
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: ${docker_connector_ref}
                imagePath: ${image_path}
                tag: <+input>
              identifier: ${identifier}_image
              type: DockerRegistry
      variables:
        - name: PORT
          type: String
          value: "5000"
        - name: NODE_ENV
          type: String
          value: ${environment}
        - name: LOG_LEVEL
          type: String
          value: ${log_level}
