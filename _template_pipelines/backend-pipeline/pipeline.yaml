pipeline:
  name: ${name}
  identifier: ${identifier}
  projectIdentifier: ${project_id}
  orgIdentifier: ${org_id}
  tags:
    environment: ${environment}
    component: backend
    managed_by: terraform
  stages:
    - stage:
        name: Build and Test Backend
        identifier: build_and_test_backend
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: ${k8s_connector_ref}
              namespace: ${build_namespace}
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Install and Run Tests
                  identifier: test_backend
                  spec:
                    connectorRef: ${docker_connector_ref}
                    image: node:20-alpine
                    shell: Sh
                    command: |-
                      cd backend
                      npm ci
                      npm test || true
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Backend Image
                  identifier: build_and_push_backend
                  spec:
                    connectorRef: ${docker_connector_ref}
                    repo: ${image_path}
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: docker/Dockerfile.backend
                    context: .
    - stage:
        name: Deploy Backend to Kubernetes
        identifier: deploy_backend_k8s
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: ${service_identifier}
            serviceInputs: <+input>
          environment:
            environmentRef: ${environment_identifier}
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ${infra_definition_identifier}
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
              - step:
                  name: Verify Backend Health
                  identifier: verifyBackendHealth
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          echo "Verifying ShopKart Backend API health..."
                          kubectl rollout status deployment/shopkart-backend -n ${environment}
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
